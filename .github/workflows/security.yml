name: security-tests
on: [push, pull_request]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Website scan and 60 server attacks
        env:
          SESSION_SECRET: ${{ secrets.TEST_SESSION_SECRET }}
          DEMO_PASSWORD: test-only-password
        run: npm test
